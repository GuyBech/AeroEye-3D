<!doctype html>
<html><body style="margin:0;background:#000">
<canvas id="c"></canvas>
<script src="world.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
const log = m => fetch('/log', { method: 'POST', body: String(m) });
window.onerror = (m, s, l) => log('JS ERROR ' + m + ' @' + l);

const VS = `#version 300 es
void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0.,1.);}`;
const TONE = `#version 300 es
precision highp float;uniform sampler2D uA;uniform float uK,uExpo;out vec4 o;
float h(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
void main(){vec3 c=texelFetch(uA,ivec2(gl_FragCoord.xy),0).rgb*uK*uExpo;
 c=aces(c*.74);c=pow(c,vec3(1./2.2));
 float l=dot(c,vec3(.2126,.7152,.0722));
 c=mix(vec3(l),c,.93);
 c*=mix(vec3(.86,.98,1.14),vec3(1.06,1.,.92),smoothstep(.08,.62,l));
 c=mix(c,c*c*(3.-2.*c),.32);
 c+=(h(gl_FragCoord.xy)-.5)/255.;o=vec4(c,1.);}`;

function prog(fs) {
  const p = gl.createProgram();
  for (const [t, s] of [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, fs]]) {
    const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) log('SHADER ' + gl.getShaderInfoLog(sh));
    gl.attachShader(p, sh);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) log('LINK ' + gl.getProgramInfoLog(p));
  return p;
}

function noiseTex() {
  // tileable value noise baked once: much faster than hashing per sample
  const N = 1024, cells = 64, g = new Float32Array(cells * cells), d = new Float32Array(N * N);
  let seed = 12345; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let i = 0; i < g.length; i++) g[i] = rnd();
  const sm = t => t * t * t * (t * (t * 6 - 15) + 10);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const fx = x / N * cells, fy = y / N * cells, ix = Math.floor(fx), iy = Math.floor(fy), ux = sm(fx - ix), uy = sm(fy - iy);
    const a = g[iy * cells + ix], b = g[iy * cells + (ix + 1) % cells], c = g[((iy + 1) % cells) * cells + ix], e = g[((iy + 1) % cells) * cells + (ix + 1) % cells];
    d[y * N + x] = (a + (b - a) * ux) * (1 - uy) + (c + (e - c) * ux) * uy;
  }
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, N, N, 0, gl.RED, gl.FLOAT, d);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  return t;
}

let P, PT, U = {}, fbo, acc, curW = 0, curH = 0;
function target(w, h) {
  if (w === curW && h === curH) return;
  curW = w; curH = h; canvas.width = w; canvas.height = h;
  if (acc) gl.deleteTexture(acc);
  acc = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, acc);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA16F, w, h);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  if (!fbo) fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, acc, 0);
}
const u = n => U[n] || (U[n] = gl.getUniformLocation(P, n));
const JIT = [[-.25, -.75], [.75, -.25], [.25, .75], [-.75, .25], [-.6, .1], [.1, -.6], [.6, -.1], [-.1, .6]];

function drawSub(fs, cam, jit) {
  const b = camBasis(cam);
  gl.uniform3fv(u('uRo'), cam.ro);
  gl.uniformMatrix3fv(u('uCam'), false, [...b.r, ...b.u, ...b.f]);
  gl.uniform1f(u('uF'), b.F);
  gl.uniform2f(u('uJit'), jit[0], jit[1]);
  gl.uniform1f(u('uT'), fs.clock);
  gl.uniform3fv(u('uDP'), fs.dp);
  // world -> drone: rows are the body axes
  gl.uniformMatrix3fv(u('uDR'), true, [...fs.R.r, ...fs.R.u, ...fs.R.f]);
  gl.uniform1f(u('uDS'), DRONE_S);
  gl.uniform1f(u('uRotA'), fs.clock * (fs.rotor > .6 ? 40 : 4 + 36 * fs.rotor));
  gl.uniform1f(u('uRotOn'), fs.rotor);
  gl.uniform1f(u('uBurn'), fs.burn);
  gl.uniform1f(u('uShowD'), fs.showD);
  gl.uniform1f(u('uPan'), fs.pan); gl.uniform1f(u('uTilt'), fs.tilt);
  gl.uniform3fv(u('uBA'), fs.tip); gl.uniform3fv(u('uBB'), fs.end);
  gl.uniform1f(u('uBOn'), fs.beam); gl.uniform1f(u('uBHit'), fs.hit);
  const TW = 6, TH = 4;
  for (let j = 0; j < TH; j++) for (let i = 0; i < TW; i++) {
    const x0 = Math.floor(i * curW / TW), x1 = Math.floor((i + 1) * curW / TW), y0 = Math.floor(j * curH / TH), y1 = Math.floor((j + 1) * curH / TH);
    gl.scissor(x0, y0, x1 - x0, y1 - y0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.flush();
  }
  gl.finish();
}

async function renderFrame(name, f, eye) {
  const sh = SHOTS[name];
  const sub = Math.max(Number(Q.get('sub') || 0), sh.sub ? 6 : 4);
  const W = sh.w || 1920, H = sh.h || 1080;
  target(W, H);
  gl.useProgram(P);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 0); gl.disable(gl.SCISSOR_TEST); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.SCISSOR_TEST); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  uni();
  const fs0 = frameState(name, f, eye);
  for (let k = 0; k < sub; k++) {
    // sub-frames sample inside the shutter only on shots that ask for motion blur
    const t = sh.sub ? f + (k / sub - .5) * .5 : f;
    const fs = frameState(name, t, eye);
    drawSub(fs, fs.cam, JIT[k % 8]);
  }
  gl.disable(gl.BLEND); gl.disable(gl.SCISSOR_TEST);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.useProgram(PT);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, acc);
  gl.uniform1i(gl.getUniformLocation(PT, 'uA'), 0);
  gl.uniform1f(gl.getUniformLocation(PT, 'uK'), 1 / sub);
  gl.uniform1f(gl.getUniformLocation(PT, 'uExpo'), 1.0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.finish();
  const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', .975));
  const tag = eye ? `${f}_${eye > 0 ? 'R' : 'L'}` : `${f}`;
  await fetch(`/f/${name}/${tag}`, { method: 'POST', body: blob });
}
let noise;
function uni() {
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, noise);
  gl.uniform1i(u('uN'), 0);
  gl.uniform2f(u('uRes'), curW, curH);
}

function meta(name) {
  // per-frame positions for the HUD layer
  const sh = SHOTS[name], W = sh.w || 1920, H = sh.h || 1080, out = [];
  const [lL, lR] = lenses();
  for (let f = 0; f < sh.n; f++) {
    const eyes = sh.eyes ? [-1, 1] : [0];
    const rec = {};
    for (const e of eyes) {
      const fs = frameState(name, f, e), b = camBasis(fs.cam);
      const P_ = p => project(p, fs.cam, b, W, H);
      const dp = P_(fs.dp);
      const pts = { drone: dp, rpx: DRONE_S * .85 / dp[2] * b.F * H, tip: P_(fs.tip), end: P_(fs.end), lensL: P_(lL), lensR: P_(lR), piv: P_(PIV) };
      if (fs.trail || name === 'track' || name === 'depth') {
        const tr = [], pr = [];
        for (let k = 1; k <= 26; k++) tr.push(P_(path(fs.tau - k * .22)));
        for (let k = 1; k <= 12; k++) pr.push(P_(path(fs.tau + k * .22)));
        pts.trail = tr; pts.pred = pr;
        pts.ahead = P_(path(fs.tau + 1.2));
        pts.ground = P_([fs.dp[0], -40, fs.dp[2]]);
      }
      if (fs.tau >= HIT_TAU - .01) {
        const tr = [];
        for (let k = 1; k <= 60; k++) {
          const tk = fs.tau - k * .05;
          if (tk < HIT_TAU) break;
          tr.push(P_(dronePos(tk)).concat([k]));
        }
        pts.smoke = tr;
        pts.hitp = P_(dronePos(HIT_TAU));
      }
      rec[e === 0 ? 'c' : (e < 0 ? 'L' : 'R')] = pts;
      if (e <= 0) {
        const rng = V.len(V.sub(fs.dp, PIV));
        Object.assign(rec, { range: rng, alt: fs.dp[1], speed: V.len(fs.v), brg: Math.atan2(fs.dp[0], fs.dp[2]) * 57.3, elv: Math.atan2(fs.dp[1] - 1.6, Math.hypot(fs.dp[0], fs.dp[2])) * 57.3, hdg: Math.atan2(fs.v[0], fs.v[2]) * 57.3, pan: fs.pan * 57.3, tilt: fs.tilt * 57.3, vx: fs.v[0], vy: fs.v[1], vz: fs.v[2], x: fs.dp[0], y: fs.dp[1], z: fs.dp[2] });
      }
    }
    out.push(rec);
  }
  return fetch(`/m/${name}`, { method: 'POST', body: JSON.stringify(out) });
}

(async () => {
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  await log('GPU ' + (dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : '?') + ' | float:' + !!gl.getExtension('EXT_color_buffer_float'));
  gl.getExtension('OES_texture_float_linear');
  const t0 = performance.now();
  const fsrc = await (await fetch('scene.frag?' + Date.now())).text();
  P = prog(fsrc); PT = prog(TONE);
  gl.bindVertexArray(gl.createVertexArray());
  noise = noiseTex();
  await log('compiled in ' + ((performance.now() - t0) / 1000).toFixed(1) + ' s');
  const job = Q.get('job');   // shot:f,f,f;shot:all
  for (const part of job.split(';')) {
    const [name, fr] = part.split(':');
    const sh = SHOTS[name];
    await meta(name);
    const list = fr === 'all' ? [...Array(sh.n).keys()] : fr.split(',').map(Number);
    for (const f of list) {
      const t1 = performance.now();
      if (sh.eyes) { await renderFrame(name, f, -1); await renderFrame(name, f, 1); }
      else await renderFrame(name, f, 0);
      if (f % 24 === 0) await log(`${name} ${f}/${sh.n} ${((performance.now() - t1) / 1000).toFixed(2)} s`);
    }
  }
  await log('DONE ' + ((performance.now() - t0) / 1000).toFixed(1) + ' s');
  await fetch('/done', { method: 'POST' });
})();
</script>
</body></html>
