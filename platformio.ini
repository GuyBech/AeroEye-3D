; AeroEye-3D — Firmware (dual-board: Arduino UNO R3 / ESP32)
;
; UNO (Elegoo UNO R3 — the current board):
;   Build:   pio run -e uno
;   Upload:  pio run -e uno -t upload
; ESP32 (kept for fallback):
;   Upload:  pio run -e esp32doit-devkit-v1 -t upload
; Monitor:   pio device monitor -b 115200

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/Servo@^1.2.1

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
